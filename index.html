<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7a2e22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="焼酎キープ帳" />
    <title>焼酎キープ帳</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">MY BOTTLE LOG</p>
        <div class="header-row">
          <div>
            <h1>焼酎キープ帳</h1>
            <p class="header-subtitle">お店のボトルを、気軽に記録。</p>
          </div>
          <span class="sake-mark" aria-hidden="true">酒</span>
        </div>
      </header>

      <section class="summary" aria-label="ボトルの集計">
        <article class="summary-card">
          <span>現在キープ中</span>
          <strong id="active-count">0</strong><small>本</small>
        </article>
        <article class="summary-card warning">
          <span>期限が近い</span>
          <strong id="expiring-count">0</strong><small>本</small>
        </article>
      </section>

      <section class="bottles-section" aria-labelledby="bottles-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">BOTTLES</p>
            <h2 id="bottles-title">キープ中のボトル</h2>
          </div>
          <label class="sort-control">
            <span class="sr-only">並び替え</span>
            <select id="sort-select">
              <option value="expiry">期限が近い順</option>
              <option value="remaining">残量が少ない順</option>
              <option value="newest">開始日が新しい順</option>
            </select>
          </label>
        </div>
        <div id="bottle-list" class="bottle-list"></div>
        <div id="empty-state" class="empty-state" hidden>
          <span aria-hidden="true">🍶</span>
          <h2>まだボトルがありません</h2>
          <p>右下のボタンから、最初の一本を登録しましょう。</p>
        </div>
      </section>
    </main>

    <button id="add-button" class="fab" type="button" aria-label="ボトルを追加">＋</button>

    <dialog id="bottle-dialog" class="sheet">
      <form id="bottle-form" method="dialog" class="sheet-content">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <div>
            <p class="eyebrow">NEW BOTTLE</p>
            <h2>ボトルを追加</h2>
          </div>
          <button class="icon-button close-dialog" type="button" aria-label="閉じる">×</button>
        </div>

        <label>
          <span>お店の名前 <b>必須</b></span>
          <input id="store" name="store" type="text" placeholder="例：やきとり日高" required maxlength="40" />
        </label>
        <label>
          <span>焼酎の銘柄 <b>必須</b></span>
          <select id="name-select" name="nameSelect" required></select>
          <input id="name-new" class="brand-new" name="nameNew" type="text" placeholder="新しい銘柄を入力" maxlength="40" hidden />
        </label>
        <div class="form-grid">
          <label>
            <span>容量（ml）</span>
            <input id="volume" name="volume" type="number" min="1" value="900" inputmode="numeric" />
          </label>
          <label>
            <span>残量（%）</span>
            <input id="remaining" name="remaining" type="number" min="0" max="100" value="100" inputmode="numeric" />
          </label>
        </div>
        <div class="form-grid">
          <label>
            <span>キープ開始日</span>
            <input id="started-at" name="startedAt" type="date" required />
          </label>
          <label>
            <span>期限</span>
            <input id="expires-at" name="expiresAt" type="date" required />
          </label>
        </div>
        <label>
          <span>メモ</span>
          <textarea id="notes" name="notes" rows="3" placeholder="例：水代 220円"></textarea>
        </label>
        <button class="primary-button" type="submit">保存する</button>
      </form>
    </dialog>

    <dialog id="detail-dialog" class="sheet detail-sheet">
      <section class="sheet-content" aria-labelledby="detail-name">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <div>
            <p id="detail-store" class="eyebrow"></p>
            <h2 id="detail-name"></h2>
          </div>
          <button class="icon-button close-dialog" type="button" aria-label="閉じる">×</button>
        </div>
        <p id="detail-volume" class="volume-label"></p>

        <section class="remaining-panel" aria-label="残量の調整">
          <div class="remaining-title"><span>残量</span><strong id="detail-remaining"></strong></div>
          <div class="progress-track"><span id="detail-progress"></span></div>
          <input id="remaining-range" type="range" min="0" max="100" step="5" aria-label="残量" />
          <div class="quantity-buttons">
            <button id="decrease-button" type="button">− 10%</button>
            <button id="increase-button" type="button">＋ 10%</button>
          </div>
        </section>

        <dl class="detail-list">
          <div><dt>キープ開始日</dt><dd id="detail-started"></dd></div>
          <div><dt>期限</dt><dd><span id="detail-expires"></span><small id="detail-days"></small></dd></div>
          <div id="detail-notes-row"><dt>メモ</dt><dd id="detail-notes"></dd></div>
        </dl>
        <button id="delete-button" class="text-button" type="button">このボトルを削除</button>
      </section>
    </dialog>

    <template id="bottle-card-template">
      <article class="bottle-card">
        <button class="card-button" type="button">
          <div class="bottle-icon" aria-hidden="true"><span></span></div>
          <div class="card-main">
            <p class="store-name"></p>
            <h3 class="bottle-name"></h3>
            <p class="expiry-label"></p>
          </div>
          <div class="card-amount">
            <strong></strong>
            <span>残量</span>
          </div>
          <div class="card-progress"><span></span></div>
        </button>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
